<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 出海营销工坊</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --text:#1f2733; --sub:#6b7686; --line:#e4e8ef;
  --primary:#2f6fed; --primary-soft:#e8f0ff; --ok:#2e9e5b; --ok-soft:#e5f6ec;
  --warn:#d98a1c; --warn-soft:#fff3df; --err:#d6423e; --err-soft:#fdeceb;
  --code:#f1f3f7; --shadow:0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161d; --card:#1b212b; --text:#e6e9ef; --sub:#98a3b3; --line:#2b3340;
    --primary:#5b93ff; --primary-soft:#1e2c47; --ok:#4cc47f; --ok-soft:#173226;
    --warn:#f0a93e; --warn-soft:#3a2c14; --err:#ef6b67; --err-soft:#3b1d1c; --code:#232a36; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12161d; --card:#1b212b; --text:#e6e9ef; --sub:#98a3b3; --line:#2b3340;
  --primary:#5b93ff; --primary-soft:#1e2c47; --ok:#4cc47f; --ok-soft:#173226;
  --warn:#f0a93e; --warn-soft:#3a2c14; --err:#ef6b67; --err-soft:#3b1d1c; --code:#232a36; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar-in{max-width:1220px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:12px 0}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2f6fed,#7a5cf0);display:grid;place-items:center;color:#fff;font-size:16px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tab{border:0;background:none;padding:16px 14px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;width:32px;height:32px;cursor:pointer}
main{max-width:1220px;margin:0 auto;padding:20px 16px 60px}
.notice{background:var(--primary-soft);color:var(--primary);border-radius:8px;padding:8px 14px;margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:16px}
.g-assets{grid-template-columns:360px 1fr}
.g-two{grid-template-columns:380px 1fr}
@media(max-width:900px){.g-assets,.g-two{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 10px;outline:none}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.inp{resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 16px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.d{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--sub);transition:.15s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs b{position:absolute;top:0;right:0;background:rgba(0,0,0,.55);color:#fff;width:18px;height:18px;line-height:18px;text-align:center;font-size:12px;cursor:pointer;border-radius:0 0 0 6px}
.tip{font-size:12px;color:var(--sub);margin-top:6px}
.tag{display:inline-block;padding:1px 9px;border-radius:5px;font-size:12px;margin:0 6px 6px 0;background:var(--primary-soft);color:var(--primary)}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.err{background:var(--err-soft);color:var(--err)} .tag.gray{background:var(--code);color:var(--sub)}
.waterfall{column-count:3;column-gap:16px}
@media(max-width:1100px){.waterfall{column-count:2}} @media(max-width:600px){.waterfall{column-count:1}}
.pcard{break-inside:avoid;margin-bottom:16px;overflow:hidden}
.pimg{aspect-ratio:1/1;display:block;width:100%;object-fit:cover}
.pimg.t2{aspect-ratio:4/5} .pimg.t3{aspect-ratio:1/1.1}
.pinfo{padding:12px}
.pinfo h4{margin:0 0 6px;font-size:15px}
.ai-t{font-size:12px;color:var(--sub);margin:8px 0 3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:#fff}
.md{line-height:1.8;word-break:break-word;min-height:200px}
.md table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--code)}
.md ul{padding-left:20px;margin:6px 0}
.md p{margin:6px 0}
.md.typing>:last-child::after,.md.typing:empty::after{content:'▍';margin-left:2px;color:var(--primary);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.alert{padding:8px 12px;border-radius:7px;margin-bottom:12px;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.err{background:var(--err-soft);color:var(--err)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--code);text-align:left;padding:8px 12px;font-weight:600}
table.t td{padding:8px 12px;border-top:1px solid var(--line)}
.sk{background:linear-gradient(90deg,var(--code) 25%,var(--line) 37%,var(--code) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.log{background:var(--code);border-radius:8px;padding:10px 12px;font:12px/1.7 Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery .g{border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--card)}
.gallery svg,.gallery img{display:block;width:100%;aspect-ratio:1/1}
.gallery small{display:block;padding:6px 8px;color:var(--sub);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px}
.kpi small{color:var(--sub)} .kpi b{display:block;font-size:26px;margin-top:2px}
.charts{display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media(max-width:900px){.charts{grid-template-columns:1fr}}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.mask{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.modal h3{margin:0 0 10px}
pre.tree{background:var(--code);border-radius:8px;padding:12px;font:13px/1.7 Menlo,Consolas,monospace;overflow:auto;margin:0 0 12px}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.15);border-radius:8px;padding:8px 16px;animation:fade .2s}
.toast.ok{border-color:var(--ok);color:var(--ok)} .toast.err{border-color:var(--err);color:var(--err)} .toast.warn{border-color:var(--warn);color:var(--warn)}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{color:var(--sub);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand"><div class="logo">✦</div>AI 出海营销工坊</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="top-right"><span class="badge">原型 · 全部为模拟数据</span><button class="icon-btn" id="theme" title="切换明暗">◐</button></div>
</div></div>
<main id="view"></main>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============ 模拟数据 ============ */

  ai:{visual_elements:[],core_selling_points:[],scene_suggestions:[]},
  t:null},
 {id:'p4',kind:'box',color:'#7a8cc2',name:'桌面多格收纳盒',audience:'日本上班族',category:'家居收纳',time:'2026-10-19 10:31',

const AI_PRESET = {
 tote:{visual_elements:['米色加厚帆布','双肩带提手','方形大容量','简约无印花'],core_selling_points:['大容量可装 15 寸电脑','加厚耐磨帆布','内置拉链口袋','可机洗'],scene_suggestions:['校园图书馆门口，抱着书本','周末市集，装满新鲜水果','海边木栈道，阳光明媚'],
  t:{en:{n:'Heavy-Duty Canvas Tote Bag',p:['Fits a 15-inch laptop','Thick, durable canvas','Inner zip pocket','Machine washable']},ja:{n:'厚手キャンバス トートバッグ',p:['15インチPC対応の大容量','丈夫な厚手キャンバス','内ファスナーポケット','洗濯機OK']},es:{n:'Bolso tote de lona gruesa',p:['Cabe un portátil de 15"','Lona gruesa y resistente','Bolsillo interior con cremallera','Lavable a máquina']}}},
 box:{visual_elements:['浅蓝灰色','多格分区','圆角方盒','哑光塑料'],core_selling_points:['6 格自由分区','叠放节省空间','防滑底垫','可拆卸隔板'],scene_suggestions:['整洁的书桌，台灯和绿植相伴','简约日式书房，木质书架','工作台一角，文具井然有序'],
  t:{en:{n:'Desktop Multi-Compartment Organizer',p:['6 flexible compartments','Stackable to save space','Non-slip base','Removable dividers']},ja:{n:'デスク収納ボックス（仕切り付き）',p:['6つの仕切りで自由に整理','積み重ねて省スペース','滑り止め付き','仕切り取り外し可能']},es:{n:'Organizador de escritorio multicompartimento',p:['6 compartimentos flexibles','Apilable, ahorra espacio','Base antideslizante','Divisores extraíbles']}}}
};
const GENERIC_T = (name)=>({en:{n:name,p:['Premium quality','Easy to use','Great for daily life','Thoughtful design']},ja:{n:name,p:['高品質','使いやすい','毎日の暮らしに','考え抜かれたデザイン']},es:{n:name,p:['Calidad premium','Fácil de usar','Ideal para el día a día','Diseño cuidado']}});

let copyHistory = [
 {id:'c1',pid:'p1',lang:'en',ch:'amazon',time:'2026-10-19 11:02'},
 {id:'c2',pid:'p1',lang:'ja',ch:'tiktok',time:'2026-10-19 11:15'},
 {id:'c3',pid:'p2',lang:'es',ch:'instagram',time:'2026-10-19 11:28'}
];
const SCENE_PROMPT = {
 0:'A matte black wireless earbud case as the hero product, placed on a sunlit park bench at sunrise, soft golden-hour backlight with gentle rim light, rule of thirds composition, shallow depth of field with blurred green trees, 85mm lens, f/1.8, commercial product photography, photorealistic, high detail, no text, no watermark',
 1:'A matte black wireless earbud case on a wooden café table beside a laptop, large window with warm morning light, soft rim lighting, 45-degree angle, shallow depth of field, 85mm lens f/1.8, cozy lifestyle product photography, photorealistic, no text, no logo',
 2:'A matte black earbud case held loosely in a commuter hand on a subway, soft cool ambient light mixed with warm highlights, centered composition, shallow depth of field, 50mm lens, commercial lifestyle photography, photorealistic, no text, no watermark'
};
let gallery = [
 {pid:'p1',scene:0,theme:'sunrise'},{pid:'p2',scene:0,theme:'office'},{pid:'p1',scene:1,theme:'cafe'},
 {pid:'p3',scene:2,theme:'beach'},{pid:'p4',scene:0,theme:'study'},{pid:'p2',scene:1,theme:'hike'}
];
const STATS = {
 prompt:[3200,4100,2800,5200,6100,4800,3900], comp:[2100,2900,1800,3600,4300,3300,2600],
 success:128, failed:9,
 byPurpose:[['vision','识图',24,41200],['copy','文案',58,96800],['prompt','提示词扩写',31,18400],['image','生图',24,0]]
};

/* ============ 工具 ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const find = id=>products.find(p=>p.id===id);
const nowStr = ()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`};
function toast(msg,type='ok'){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toast').appendChild(el);setTimeout(()=>el.remove(),2400)}
function openModal(html){$('#modal').innerHTML=html;$('#mask').classList.add('on')}
function closeModal(){$('#mask').classList.remove('on')}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeModal()});
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const analyzed = p=>p.ai.core_selling_points.length>0;

/* 商品插画（用 SVG 模拟商品图） */
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;const c=v=>Math.max(0,Math.min(255,v));return '#'+[c(r),c(g),c(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function productShape(kind,c){
  const d=shade(c,-35),l=shade(c,45);
  if(kind==='earbuds')return `<rect x="62" y="78" width="76" height="62" rx="22" fill="${c}"/><path d="M62 104h76" stroke="${d}" stroke-width="3"/><circle cx="100" cy="104" r="5" fill="${l}"/><ellipse cx="84" cy="64" rx="11" ry="15" fill="${l}"/><ellipse cx="116" cy="64" rx="11" ry="15" fill="${l}"/>`;
  if(kind==='bottle')return `<rect x="78" y="46" width="44" height="18" rx="6" fill="${d}"/><rect x="70" y="62" width="60" height="100" rx="14" fill="${c}"/><rect x="78" y="76" width="8" height="70" rx="4" fill="${l}" opacity=".55"/>`;
  if(kind==='tote')return `<path d="M72 84c0-34 56-34 56 0" fill="none" stroke="${d}" stroke-width="7" stroke-linecap="round"/><path d="M58 84h84l8 76H50z" fill="${c}"/><rect x="82" y="108" width="36" height="22" rx="4" fill="${l}" opacity=".6"/>`;
  return `<path d="M54 96l46-22 46 22v44l-46 22-46-22z" fill="${c}"/><path d="M54 96l46 22 46-22" fill="none" stroke="${l}" stroke-width="3"/><path d="M100 118v44" stroke="${d}" stroke-width="3"/>`;
}
function productImg(p,cls=''){
  if(p.img)return `<img class="pimg ${cls}" src="${p.img}" alt="${esc(p.name)}">`;
  const c=p.color;
  return `<svg class="pimg ${cls}" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${shade(c,95)}"/><stop offset="1" stop-color="${shade(c,60)}"/></linearGradient></defs><rect width="200" height="200" fill="url(#bg${p.id})"/><ellipse cx="100" cy="166" rx="48" ry="7" fill="rgba(0,0,0,.14)"/>${productShape(p.kind,c)}</svg>`;
}
const THEMES={
 sunrise:['#ffd9a8','#8fc4a1','☀'],office:['#cfe3f6','#e9d9c4','▤'],cafe:['#f0dcc4','#b88c62','☕'],
 beach:['#bfe6f2','#f3dfb3','≈'],study:['#e5e8f3','#c9b79c','▥'],hike:['#cfe5c9','#7da679','▲']
};
function sceneArt(item){

function md(src){
  const lines=src.split('\n'),out=[];let i=0;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  while(i<lines.length){
    const l=lines[i];
    if(l.startsWith('|')){const rows=[];while(i<lines.length&&lines[i].startsWith('|')){rows.push(lines[i]);i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      const head=cells(rows[0]),body=rows.slice(2).map(cells);
      out.push(`<table><tr>${head.map(h=>`<th>${inl(h)}</th>`).join('')}</tr>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</table>`);continue}
    if(l.startsWith('- ')){const li=[];while(i<lines.length&&lines[i].startsWith('- ')){li.push(`<li>${inl(lines[i].slice(2))}</li>`);i++}out.push(`<ul>${li.join('')}</ul>`);continue}
    if(l.trim()===''){i++;continue}
    out.push(`<p>${inl(l)}</p>`);i++;
  }
  return out.join('');
}

  const p=find(sf.pid);
  $('#view').innerHTML=`
  <div class="notice">对应作业 7：LLM 扩写英文生图提示词 → 下发异步任务 → 骨架屏占位 → 每 3 秒轮询 → 渲染场景主图。生成的画面为示意插画。</div>
  <div class="grid g-two">
   <div class="card"><h3>场景图设置</h3><div class="card-b">
    <label class="f"><span>商品（仅显示已 AI 识别的）</span><select class="inp" id="s-p">${ready.length?ready.map(x=>`<option value="${x.id}" ${x.id===sf.pid?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">暂无，请先去资产中心识别</option>'}</select></label>
    <div class="f"><span style="display:block;font-size:13px;color:var(--sub);margin-bottom:6px">场景建议（来自 AI 识别结果）</span>
     ${p?p.ai.scene_suggestions.map((s,i)=>`<label style="display:flex;gap:8px;margin-bottom:6px;cursor:pointer"><input type="radio" name="sc" value="${i}" ${i===sf.scene?'checked':''}><span>${esc(s)}</span></label>`).join(''):''}</div>
    <button class="btn p" id="s-go">生成场景主图</button>
   </div></div>
   <div class="card"><h3>生成结果</h3><div class="card-b"><div id="s-out"><div class="empty">选择商品与场景后点击生成</div></div></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>已生成场景图</h3><div class="card-b"><div class="gallery" id="gal"></div></div></div>`;
  $('#s-p').onchange=e=>{sf.pid=e.target.value;sf.scene=0;viewScene()};
  document.querySelectorAll('input[name=sc]').forEach(r=>r.onchange=()=>sf.scene=+r.value);
  $('#s-go').onclick=startScene;renderGallery();
}
function renderGallery(){
  $('#gal').innerHTML=gallery.map(g=>`<div class="g">${sceneArt(g)}<small>${esc(find(g.pid)?.name||'')}</small></div>`).join('');
}
function startScene(){
  const p=find(sf.pid);if(!p)return toast('请先选择商品','warn');
  const out=$('#s-out'),btn=$('#s-go');
  const prompt=SCENE_PROMPT[sf.scene%3].replace(/matte black wireless earbud case|matte black earbud case/,()=>p.t?p.t.en.n.toLowerCase():'product');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>生成中…';
  out.innerHTML=`<div class="sk" style="height:300px"></div><div class="tip" id="s-info" style="margin-top:10px">① 正在用 LLM 扩写英文提示词…</div><div class="log" id="s-log"></div>`;
  setTimeout(()=>{
    $('#s-log').textContent='[image-prompt] 场景：'+p.ai.scene_suggestions[sf.scene]+'\n[image-prompt] 扩写后的提示词：\n'+prompt;
    $('#s-info').textContent='② 已下发异步任务 task_id=wanx-7f3a91…，每 3 秒轮询一次';
    pollN=0;stopPoll();
    poller=setInterval(()=>{
      pollN++;
      if(pollN<3){$('#s-info').textContent=`② 第 ${pollN} 次轮询：任务 ${pollN===1?'PENDING':'RUNNING'}…`;return}
      stopPoll();
      const themes=Object.keys(THEMES),item={pid:p.id,scene:sf.scene,theme:themes[(Math.random()*themes.length)|0]};
      gallery.unshift(item);
      out.innerHTML=`<div style="max-width:420px;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line)">${sceneArt(item)}</div><div class="alert ok" style="margin-top:12px">第 ${pollN} 次轮询：任务 SUCCEEDED，图片已下载到本地并写入数据库。</div><details open><summary style="cursor:pointer">查看 AI 扩写的英文提示词</summary><div class="log">${esc(prompt)}</div></details>`;
      btn.disabled=false;btn.textContent='生成场景主图';renderGallery();toast('场景图生成完成');
    },3000);
  },900);
}

/* ============ 运营看板（SVG 图表） ============ */
function viewStats(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`});
  const total=STATS.prompt.reduce((a,b)=>a+b,0)+STATS.comp.reduce((a,b)=>a+b,0);
  const calls=STATS.success+STATS.failed,rate=(STATS.success/calls*100).toFixed(1);
  $('#view').innerHTML=`
  <div class="notice">对应作业 8：Token 埋点统计 + ECharts 看板（此处用 SVG 模拟折线图与饼图）。<b>当前统计均为演示数据，非真实调用。</b></div>
  <div class="kpis">
   <div class="card kpi"><small>近 7 天 Token 消耗</small><b>${total.toLocaleString()}</b></div>
   <div class="card kpi"><small>API 调用次数</small><b>${calls}</b></div>
   <div class="card kpi"><small>成功率</small><b>${rate}%</b></div>
   <div class="card kpi"><small>平均耗时</small><b>3.2s</b></div>
  </div>
  <div class="charts">
   <div class="card"><h3>每日 Token 消耗走势</h3><div class="card-b">${lineChart(days,[['Prompt Tokens','var(--primary)',STATS.prompt],['Completion Tokens','var(--warn)',STATS.comp]])}
    <div class="legend"><span><i style="background:var(--primary)"></i>Prompt Tokens</span><span><i style="background:var(--warn)"></i>Completion Tokens</span></div></div></div>
   <div class="card"><h3>API 调用成功率</h3><div class="card-b">${donut(STATS.success,STATS.failed,rate)}
    <div class="legend"><span><i style="background:var(--ok)"></i>成功 ${STATS.success}</span><span><i style="background:var(--err)"></i>失败 ${STATS.failed}</span></div></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>各功能消耗明细</h3><table class="t"><tr><th>功能</th><th>调用次数</th><th>Token 总量</th><th>说明</th></tr>
   ${STATS.byPurpose.map(r=>`<tr><td>${r[1]} <span class="tag gray">${r[0]}</span></td><td>${r[2]}</td><td>${r[3].toLocaleString()}</td><td style="color:var(--sub)">${r[0]==='image'?'生图按张计费，不计文本 Token，仅计入次数与成功率':'由 llmClient 统一埋点'}</td></tr>`).join('')}</table></div>`;
}
function lineChart(labels,series){
  const W=560,H=260,L=48,R=16,T=14,B=30,max=Math.ceil(Math.max(...series.flatMap(s=>s[2]))/2000)*2000;
  const x=i=>L+(W-L-R)*i/(labels.length-1),y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--sub)">${v>=1000?(v/1000)+'k':v}</text>`}
  labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--sub)">${l}</text>`);
  series.forEach(([n,c,d])=>{
    g+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${d.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
    d.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--card)" stroke="${c}" stroke-width="2"><title>${labels[i]} ${n}：${v.toLocaleString()}</title></circle>`);
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>`;
}
function donut(a,b,rate){
  const r=70,C=2*Math.PI*r,fa=C*a/(a+b);
  return `<svg viewBox="0 0 220 220" style="width:100%;max-width:260px;display:block;margin:0 auto"><g transform="rotate(-90 110 110)"><circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--err)" stroke-width="28"><title>失败 ${b} 次</title></circle><circle cx="110" cy="110" r="${r}" fill="none" stroke="var(--ok)" stroke-width="28" stroke-dasharray="${fa} ${C}"><title>成功 ${a} 次</title></circle></g><text x="110" y="106" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">${rate}%</text><text x="110" y="128" text-anchor="middle" font-size="12" fill="var(--sub)">成功率</text></svg>`;
}

go();
</script>
